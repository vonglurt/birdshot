#
# On every v* tag: re-run the gate, build the canonical sdist + wheel, and
# attach them to the tag's GitHub Release (creating it, as a pre-release for
# rc/dev tags, if the tag arrived without one). The Release page is the
# download point every packaging/ channel's source= URL consumes.
# docs/PACKAGING.md, Phase 5.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: gate
        run: make check

      - name: build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
          sha256sum dist/*

      - name: ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            case "$tag" in
              *-rc*|*dev*) pre=--prerelease ;;
              *)           pre= ;;
            esac
            gh release create "$tag" $pre --verify-tag \
              --title "birdshot $tag" --generate-notes
          fi

      - name: attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  # The native line: build, selftest and attach one static binary per
  # platform. Runs on every v* tag alongside the Python artifacts; the
  # selftest gates the upload the same way `make check` gates the wheel.
  native:
    needs: build-and-attach
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: birdshot-linux-x86_64
          - os: macos-latest
            artifact: birdshot-macos-arm64
          - os: windows-latest
            artifact: birdshot-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: selftest and stage (unix)
        if: runner.os != 'Windows'
        run: |
          build/birdshot selftest
          cp build/birdshot "${{ matrix.artifact }}"
      - name: selftest and stage (windows)
        if: runner.os == 'Windows'
        run: |
          build/Release/birdshot.exe selftest
          cp build/Release/birdshot.exe "${{ matrix.artifact }}"
      - name: attach
        # bash everywhere: under the windows runner's default PowerShell,
        # "${GITHUB_REF_NAME}" is a (n undefined) pwsh variable, not the env
        # var, and the upload went looking for a release named "".
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ matrix.artifact }}" --clobber
